name: Build Ardna APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}
      VITE_GOOGLE_AUTH_ENABLED: ${{ vars.VITE_GOOGLE_AUTH_ENABLED }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip -q Ardna-v3.0.0.zip -d project

      - name: Validate configuration
        working-directory: project/ardna-app
        run: node scripts/validate-config.mjs

      - name: Install dependencies
        working-directory: project/ardna-app
        run: npm ci

      - name: Run tests
        working-directory: project/ardna-app
        run: npm test

      - name: Build and sync Android
        working-directory: project/ardna-app
        run: npm run android:sync

      - name: Build APK
        working-directory: project/ardna-app/android
        run: bash gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ardna-v3.0.0-APK
          path: project/ardna-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error