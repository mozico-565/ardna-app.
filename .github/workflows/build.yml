name: Build Ardna v3.4.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Ardna-v3.4.0-responsive-branding-source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}
      VITE_GOOGLE_AUTH_ENABLED: ${{ vars.VITE_GOOGLE_AUTH_ENABLED }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Ardna v3.4.0
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="Ardna-v3.4.0-responsive-branding-source.zip"
          DESTINATION="$RUNNER_TEMP/ardna-v3.4.0"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::لم يتم العثور على $ARCHIVE في جذر المستودع"
            exit 1
          fi

          rm -rf "$DESTINATION"
          mkdir -p "$DESTINATION"
          unzip -q "$ARCHIVE" -d "$DESTINATION"

          PACKAGE_FILE="$(find "$DESTINATION" \
            -type f \
            -name package.json \
            -not -path "*/node_modules/*" \
            -print \
            -quit)"

          if [[ -z "$PACKAGE_FILE" ]]; then
            echo "::error::لم يتم العثور على package.json داخل الملف المضغوط"
            exit 1
          fi

          ROOT="${PACKAGE_FILE%/package.json}"

          echo "Project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate configuration
        working-directory: ${{ steps.project.outputs.root }}
        run: node scripts/validate-config.mjs

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.root }}
        run: npm ci

      - name: TypeScript check
        working-directory: ${{ steps.project.outputs.root }}
        run: npm run typecheck

      - name: Run security and UX tests
        working-directory: ${{ steps.project.outputs.root }}
        run: npm test

      - name: Build web app and sync Capacitor
        working-directory: ${{ steps.project.outputs.root }}
        run: npm run android:sync

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.root }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare optional release signing
        id: signing
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.root }}
          KEYSTORE_BASE64: ${{ secrets.ARDNA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ARDNA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARDNA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ARDNA_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -n "$KEYSTORE_BASE64" && \
                -n "$STORE_PASSWORD" && \
                -n "$KEY_ALIAS" && \
                -n "$KEY_PASSWORD" ]]; then

            KEYSTORE_PATH="$PROJECT_ROOT/android/app/ardna-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are incomplete; Debug APK only."
          fi

      - name: Build signed Release APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ${{ steps.project.outputs.root }}/android
        env:
          ARDNA_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          ARDNA_STORE_PASSWORD: ${{ secrets.ARDNA_STORE_PASSWORD }}
          ARDNA_KEY_ALIAS: ${{ secrets.ARDNA_KEY_ALIAS }}
          ARDNA_KEY_PASSWORD: ${{ secrets.ARDNA_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ardna-v3.4.0-Debug-APK
          path: ${{ steps.project.outputs.root }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed Release APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Ardna-v3.4.0-Signed-Release
          path: |
            ${{ steps.project.outputs.root }}/android/app/build/outputs/apk/release/app-release.apk
            ${{ steps.project.outputs.root }}/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30