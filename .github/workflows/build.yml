name: Build Ardna APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}
      VITE_GOOGLE_AUTH_ENABLED: ${{ vars.VITE_GOOGLE_AUTH_ENABLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project and detect root
        id: project
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          unzip -q Ardna-v3.1.0-secure.zip -d project

          echo "=== Extracted structure ==="
          find project -maxdepth 3 -type f | head -100

          ROOT="$(find project \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -printf '%h\n' \
            | head -n 1)"

          if [ -z "$ROOT" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          echo "Detected project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Validate configuration
        run: |
          cd "${{ steps.project.outputs.root }}"
          node scripts/validate-config.mjs

      - name: Install dependencies
        run: |
          cd "${{ steps.project.outputs.root }}"
          npm ci

      - name: Run tests
        run: |
          cd "${{ steps.project.outputs.root }}"
          npm test

      - name: Build and sync Android
        run: |
          cd "${{ steps.project.outputs.root }}"
          npm run android:sync

      - name: Build APK
        run: |
          cd "${{ steps.project.outputs.root }}/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ardna-v3.1.0-APK
          path: ${{ steps.project.outputs.root }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error