name: Publish Ardna Website

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}
      VITE_GOOGLE_AUTH_ENABLED: ${{ vars.VITE_GOOGLE_AUTH_ENABLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract project and detect root
        id: project
        shell: bash
        run: |
          mkdir -p project
          unzip -q Ardna-v3.2.0-security.zip -d project

          ROOT="$(find project \
            -type f \
            -name package.json \
            -not -path '*/node_modules/*' \
            -printf '%h\n' \
            | head -n 1)"

          if [ -z "$ROOT" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          echo "Detected project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Validate configuration
        run: |
          cd "${{ steps.project.outputs.root }}"
          node scripts/validate-config.mjs

      - name: Install dependencies
        run: |
          cd "${{ steps.project.outputs.root }}"
          npm ci

      - name: Run tests
        run: |
          cd "${{ steps.project.outputs.root }}"
          npm test

      - name: Build website
        run: |
          cd "${{ steps.project.outputs.root }}"
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.project.outputs.root }}/dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4