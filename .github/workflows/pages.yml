name: Publish Ardna v3.6.0 Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Ardna-v3.6.0-GitHub-Upload.zip"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ardna-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}
      VITE_GOOGLE_AUTH_ENABLED: ${{ vars.VITE_GOOGLE_AUTH_ENABLED }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Ardna v3.6.0
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="Ardna-v3.6.0-GitHub-Upload.zip"
          DESTINATION="$RUNNER_TEMP/ardna-v3.6.0"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::لم يتم العثور على $ARCHIVE في جذر المستودع"
            exit 1
          fi

          rm -rf "$DESTINATION"
          mkdir -p "$DESTINATION"
          unzip -q "$ARCHIVE" -d "$DESTINATION"

          PACKAGE_FILE="$(find "$DESTINATION" \
            -type f \
            -name package.json \
            -not -path "*/node_modules/*" \
            -print \
            -quit)"

          if [[ -z "$PACKAGE_FILE" ]]; then
            echo "::error::لم يتم العثور على package.json داخل الملف المضغوط"
            exit 1
          fi

          ROOT="${PACKAGE_FILE%/package.json}"

          echo "Project root: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate configuration
        working-directory: ${{ steps.project.outputs.root }}
        run: node scripts/validate-config.mjs

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.root }}
        run: npm ci

      - name: TypeScript check
        working-directory: ${{ steps.project.outputs.root }}
        run: npm run typecheck

      - name: Run security and UX tests
        working-directory: ${{ steps.project.outputs.root }}
        run: npm test

      - name: Build production website
        working-directory: ${{ steps.project.outputs.root }}
        run: npm run build

      - name: Add GitHub Pages SPA fallback
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.project.outputs.root }}/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4