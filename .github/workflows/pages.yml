name: Publish Ardna Website

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}
      VITE_GOOGLE_AUTH_ENABLED: ${{ vars.VITE_GOOGLE_AUTH_ENABLED }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract project
        run: unzip -q Ardna-v3.1.0-secure.zip -d project

      - name: Validate configuration
        working-directory: project/ardna-app
        run: node scripts/validate-config.mjs

      - name: Install dependencies
        working-directory: project/ardna-app
        run: npm ci

      - name: Run tests
        working-directory: project/ardna-app
        run: npm test

      - name: Build website
        working-directory: project/ardna-app
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: project/ardna-app/dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4