name: Publish Ardna Website

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract and build
        run: |
          unzip -q ardna-app-with-apk-workflow.zip -d project
          cd project/ardna-app
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: project/ardna-app/dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4